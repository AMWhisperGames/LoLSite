<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Draft — Make a selection</title>
    <meta
      name="description"
      content="Whisper Draft home. Make a selection: League of Legends, Heroes of the Storm, or UFC."
    />
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=59" />
  </head>
  <body class="home-page">
    <div class="vignette"></div>

    <div class="home-app">
      <header class="topbar home-topbar">
        <div class="brand">
          <a class="brand-mark" href="index.html" aria-current="page" aria-label="Whisper Draft home">W</a>
          <div>
            <strong>Whisper Draft</strong>
          </div>
        </div>
        <div class="phase-wrap">
          <p class="phase-kicker">Home</p>
          <h1 class="phase-title done">Make a selection</h1>
        </div>
        <div class="top-actions home-top-actions" aria-hidden="true"></div>
      </header>

      <main class="home-main">
        <section class="home-choices" aria-label="Make a selection">
          <a class="home-choice" href="league.html">
            <img
              class="home-choice-logo"
              src="assets/league-logo.jpg"
              alt=""
            />
            <span>League of Legends</span>
          </a>

          <a class="home-choice" href="heroes/">
            <img
              class="home-choice-logo"
              src="assets/heroes-logo.jpg"
              alt=""
            />
            <span>Heroes of the Storm</span>
          </a>

          <a class="home-choice" href="ufc/">
            <img
              class="home-choice-logo home-choice-logo-ufc"
              src="assets/ufc-logo.png"
              alt=""
            />
            <span>UFC</span>
          </a>
        </section>
      </main>

      <footer class="home-foot">
        <p>Whisper Draft — click the W on any page to return here.</p>
      </footer>
    </div>
  </body>
</html>
